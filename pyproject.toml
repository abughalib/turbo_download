[project]
name = "turboget"
version = "1.0.0"
description = "Multi-WAN parallel download manager using Linux policy routing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["download", "multi-wan", "networking", "bandwidth", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Utilities",
]
dependencies = [
    "aiohttp>=3.9",
    "aiofiles>=23.0",
    "rich>=13.0",
    "click>=8.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.scripts]
turboget = "turboget.cli:cli"

[project.urls]
Homepage = "https://github.com/yourusername/turboget"
"Bug Tracker" = "https://github.com/yourusername/turboget/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["turboget"]
